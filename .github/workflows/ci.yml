name: CI

on:
  pull_request:
    branches:
      - main

concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test-and-build:
    name: Test and build
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Run tests and build boot jars
        run: |
          chmod +x gradlew
          ./gradlew clean test :payment-service:bootJar :payment-test-tools:bootJar --no-daemon

      - name: Validate payment-service image
        run: docker build -t omc-payment-service:ci payment-service

      - name: Validate payment-test-tools image
        run: docker build -t omc-payment-test-tools:ci payment-test-tools

  deployment-config:
    name: Validate deployment configuration
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      IMAGE_REGISTRY: asia-northeast3-docker.pkg.dev/omc-payment/omc-payment
      IMAGE_TAG: ci
      APP_INTERNAL_IP: 10.20.0.10
      INFRA_INTERNAL_IP: 10.20.0.20
      TEST_INTERNAL_IP: 10.20.0.30
      DB_USERNAME: omc
      DB_PASSWORD: ci-only
      GRAFANA_ADMIN_PASSWORD: ci-only
      TOSS_SECRET_KEY: ci-only
      GATEWAY_SECRET: ci-only
      TEST_TOOLS_VERIFIER_ENABLED: "false"

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Validate shell scripts
        run: |
          bash -n deploy/gcp/scripts/deploy-role.sh
          bash -n deploy/gcp/scripts/recover-kafka-after-zookeeper-loss.sh
          bash -n deploy/gcp/scripts/run-load-test.sh
          bash -n deploy/gcp/scripts/wait-role-health.sh
          bash -n infra/gcp/scripts/startup.sh
          bash -n scripts/gcp/deploy-ci.sh

      - name: Validate Docker Compose
        run: |
          docker compose -f deploy/gcp/docker-compose.infra.yml config --quiet
          docker compose -f deploy/gcp/docker-compose.app.yml config --quiet
          docker compose -f deploy/gcp/docker-compose.test.yml config --quiet
          docker compose -f deploy/gcp/docker-compose.app.yml -f deploy/gcp/docker-compose.scaleout-8p8c.yml config --quiet
          docker compose -f deploy/gcp/docker-compose.app.yml -f deploy/gcp/docker-compose.failover-test.yml config --quiet
          docker compose -f deploy/gcp/docker-compose.app.yml -f deploy/gcp/docker-compose.scheduler-test.yml config --quiet

      - name: Check Terraform formatting
        run: terraform -chdir=infra/gcp fmt -check -recursive

      - name: Validate Terraform
        run: |
          terraform -chdir=infra/gcp init -backend=false
          terraform -chdir=infra/gcp validate
