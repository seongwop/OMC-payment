name: omc-payment-infra

services:
  postgres:
    image: postgres:18-alpine
    container_name: omc-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: omc
    ports:
      - "5432:5432"
    volumes:
      - /mnt/omc-postgres:/var/lib/postgresql
      - ./assets/01_create_payment_schema.sql:/docker-entrypoint-initdb.d/01_create_payment_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d omc"]
      interval: 5s
      timeout: 5s
      retries: 20
    mem_limit: 4g
    networks: [payment-infra]

  redis:
    image: redis:7.2-alpine
    container_name: omc-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - ./data/redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    mem_limit: 1g
    networks: [payment-infra]

  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: omc-zookeeper
    restart: unless-stopped
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
      KAFKA_HEAP_OPTS: -Xms256m -Xmx1g
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 2181"]
      interval: 10s
      timeout: 5s
      retries: 20
    mem_limit: 1536m
    volumes:
      - /mnt/omc-kafka/zookeeper/data:/var/lib/zookeeper/data
      - /mnt/omc-kafka/zookeeper/log:/var/lib/zookeeper/log
    networks: [payment-infra]

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: omc-kafka
    restart: unless-stopped
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://${INFRA_INTERNAL_IP}:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_NUM_PARTITIONS: ${KAFKA_TOPIC_DEFAULT_PARTITIONS:-3}
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_HEAP_OPTS: -Xms1g -Xmx3g
    volumes:
      - /mnt/omc-kafka/data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics --bootstrap-server localhost:29092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 30
    mem_limit: 5g
    networks: [payment-infra]

  toss-wiremock:
    image: wiremock/wiremock:3.9.1
    container_name: omc-toss-wiremock
    restart: unless-stopped
    ports:
      - "18080:8080"
    volumes:
      - ./simulators/toss-pg/mappings:/home/wiremock/mappings:ro
    command:
      - --global-response-templating
      - --async-response-enabled
      - "true"
      - --async-response-threads
      - "150"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/__admin/mappings >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
    mem_limit: 3g
    networks: [payment-infra]

  node-exporter:
    image: quay.io/prometheus/node-exporter:v1.9.1
    container_name: omc-infra-node-exporter
    restart: unless-stopped
    command:
      - --path.rootfs=/host
    pid: host
    ports:
      - "9100:9100"
    volumes:
      - /:/host:ro,rslave
    mem_limit: 128m
    networks: [payment-infra]

networks:
  payment-infra:
