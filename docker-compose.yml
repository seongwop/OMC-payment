services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: ${DB_USERNAME:-omc}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-password}
      POSTGRES_DB: omc
    ports:
      - "${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - postgres18_data:/var/lib/postgresql
      - ./infra/local/01_create_payment_schema.sql:/docker-entrypoint-initdb.d/01_create_payment_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-omc} -d omc"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [payment-lab]

  redis:
    image: redis:7.2-alpine
    ports:
      - "${REDIS_HOST_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [payment-lab]

  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks: [payment-lab]

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    depends_on:
      - zookeeper
    ports:
      - "${KAFKA_HOST_PORT:-9092}:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:${KAFKA_HOST_PORT:-9092}
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics --bootstrap-server localhost:29092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 15
    networks: [payment-lab]

  toss-wiremock:
    image: wiremock/wiremock:3.9.1
    ports:
      - "${TOSS_WIREMOCK_HOST_PORT:-18080}:8080"
    volumes:
      - ./simulators/toss-pg/mappings:/home/wiremock/mappings:ro
    command:
      - "--global-response-templating"
      - "--async-response-enabled"
      - "true"
      - "--async-response-threads"
      - "150"
      - "--verbose"
    networks: [payment-lab]

  payment-service:
    build:
      context: ./payment-service
    environment:
      TZ: Asia/Seoul
      DB_HOST: postgres
      DB_USERNAME: ${DB_USERNAME:-omc}
      DB_PASSWORD: ${DB_PASSWORD:-password}
      REDIS_HOST: redis
      KAFKA_URI: kafka:29092
      KAFKA_TOPIC_DEFAULT_PARTITIONS: ${KAFKA_TOPIC_DEFAULT_PARTITIONS:-3}
      KAFKA_LISTENER_CONCURRENCY: ${KAFKA_LISTENER_CONCURRENCY:-3}
      PAYMENT_PG_MODE: ${PAYMENT_PG_MODE:-toss}
      TOSS_BASE_URL: http://toss-wiremock:8080
      TOSS_SECRET_KEY: ${TOSS_SECRET_KEY:-test-secret-key}
      TOSS_READ_TIMEOUT_MS: ${TOSS_READ_TIMEOUT_MS:-3000}
      TOSS_MAX_CONNECTIONS: ${TOSS_MAX_CONNECTIONS:-170}
      TOSS_MAX_CONNECTIONS_PER_ROUTE: ${TOSS_MAX_CONNECTIONS_PER_ROUTE:-170}
      TOSS_BULKHEAD_MAX_CONCURRENT_CALLS: ${TOSS_BULKHEAD_MAX_CONCURRENT_CALLS:-160}
      PAYMENT_DATASOURCE_MAX_POOL_SIZE: ${PAYMENT_DATASOURCE_MAX_POOL_SIZE:-30}
      PAYMENT_UNKNOWN_RECOVERY_INITIAL_DELAY_MS: ${PAYMENT_UNKNOWN_RECOVERY_INITIAL_DELAY_MS:-60000}
      PAYMENT_UNKNOWN_RECOVERY_FIXED_DELAY_MS: ${PAYMENT_UNKNOWN_RECOVERY_FIXED_DELAY_MS:-30000}
    ports:
      - "${PAYMENT_SERVICE_HOST_PORT:-8085}:8085"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      toss-wiremock:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8085/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 60s
    networks: [payment-lab]

  payment-test-tools:
    build:
      context: ./payment-test-tools
    environment:
      TZ: Asia/Seoul
      DB_HOST: postgres
      DB_USERNAME: ${DB_USERNAME:-omc}
      DB_PASSWORD: ${DB_PASSWORD:-password}
      KAFKA_URI: kafka:29092
      TEST_TOOLS_KAFKA_GROUP_ID: ${TEST_TOOLS_KAFKA_GROUP_ID:-payment-test-tools-verifier}
      TEST_TOOLS_VERIFIER_ENABLED: ${TEST_TOOLS_VERIFIER_ENABLED:-true}
      TEST_TOOLS_VERIFICATION_TIMEOUT: ${TEST_TOOLS_VERIFICATION_TIMEOUT:-15s}
    ports:
      - "${PAYMENT_TEST_TOOLS_HOST_PORT:-8090}:8090"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      payment-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8090/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks: [payment-lab]

  prometheus:
    image: prom/prometheus:v3.5.0
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "${PROMETHEUS_HOST_PORT:-19090}:9090"
    depends_on:
      payment-service:
        condition: service_healthy
    networks: [payment-lab]

  grafana:
    image: grafana/grafana:12.1.0
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - grafana_data:/var/lib/grafana
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "${GRAFANA_HOST_PORT:-13000}:3000"
    depends_on:
      - prometheus
    networks: [payment-lab]

networks:
  payment-lab:

volumes:
  postgres18_data:
  redis_data:
  grafana_data:
