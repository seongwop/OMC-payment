server:
  port: ${SERVER_PORT:8090}

spring:
  application:
    name: payment-test-tools
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:omc}?currentSchema=payment_db
    username: ${DB_USERNAME:omc}
    password: ${DB_PASSWORD:password}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${TEST_TOOLS_DATASOURCE_MAX_POOL_SIZE:5}
      minimum-idle: ${TEST_TOOLS_DATASOURCE_MIN_IDLE:1}
  kafka:
    bootstrap-servers: ${KAFKA_URI:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      properties:
        enable.idempotence: true
    consumer:
      group-id: ${TEST_TOOLS_KAFKA_GROUP_ID:payment-test-tools-verifier}
      auto-offset-reset: earliest
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    listener:
      ack-mode: record
      missing-topics-fatal: false

payment-test-tools:
  publish-timeout: ${TEST_TOOLS_PUBLISH_TIMEOUT:10s}
  verifier:
    enabled: ${TEST_TOOLS_VERIFIER_ENABLED:true}
  verification:
    default-timeout: ${TEST_TOOLS_VERIFICATION_TIMEOUT:15s}
    default-poll-interval: ${TEST_TOOLS_VERIFICATION_POLL_INTERVAL:200ms}

management:
  health:
    db:
      enabled: ${TEST_TOOLS_DB_HEALTH_ENABLED:${TEST_TOOLS_VERIFIER_ENABLED:true}}
  endpoints:
    web:
      exposure:
        include: health,info
